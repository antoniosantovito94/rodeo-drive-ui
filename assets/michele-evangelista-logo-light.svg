<svg width="320" height="140" viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Michele Evangelista</title>
  <desc>Michele Evangelista brand wordmark — versione chiara</desc>

  <!-- Diamond mark -->
  <polygon points="160,8 167,22 160,36 153,22" fill="#c9a96e"/>
  <line x1="160" y1="0"  x2="160" y2="6"  stroke="#c9a96e" stroke-width="0.8"/>
  <line x1="160" y1="38" x2="160" y2="46" stroke="#c9a96e" stroke-width="0.8"/>
  <line x1="141" y1="22" x2="151" y2="22" stroke="#c9a96e" stroke-width="0.8"/>
  <line x1="169" y1="22" x2="179" y2="22" stroke="#c9a96e" stroke-width="0.8"/>

  <!-- MICHELE -->
  <text
    x="160" y="88"
    text-anchor="middle"
    font-family="'Josefin Sans', 'Futura', 'Century Gothic', sans-serif"
    font-weight="100"
    font-size="34"
    letter-spacing="7"
    fill="#0a0a0a">MICHELE</text>

  <!-- Gold rule -->
  <line x1="20" y1="98" x2="300" y2="98" stroke="#c9a96e" stroke-width="0.7"/>

  <!-- EVANGELISTA -->
  <text
    x="160" y="126"
    text-anchor="middle"
    font-family="'Josefin Sans', 'Futura', 'Century Gothic', sans-serif"
    font-weight="300"
    font-size="19"
    letter-spacing="5"
    fill="#0a0a0a">EVANGELISTA</text>
</svg>
